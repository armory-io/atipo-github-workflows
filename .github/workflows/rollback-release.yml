name: Rollback Github (Pre)Release

on:
  workflow_call:
    inputs:
      version:
        description: "(Pre)Release to revert; This will cause a deploy to the previous stable version"
        type: string
        required: true

jobs:
  rollback:
    name: Rollback specific version
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Rollback Release
        uses: author/action-rollback@d3f0d502876dcfda4227f30b5c9a6999e40b9c81 # stable
        with:
          # Using a tag name
          tag: ${{ inputs.version }}
